name: Offline version (Windows zip)

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", ".github/workflows/pages.yml", "README.md", "AGENTS.md", "skills/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller tkinterdnd2

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $urls = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest $u -OutFile ffmpeg.zip
              Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl -Force
              $exe = Get-ChildItem ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
              if ($exe) { Copy-Item $exe.FullName ffmpeg.exe; break }
            } catch { Write-Host "failed: $u" }
          }
          if (-not (Test-Path ffmpeg.exe)) { throw "ffmpeg download failed" }
          .\ffmpeg.exe -version | Select-Object -First 1

      - name: Make test media (12 min, silent gap every 7 s)
        shell: pwsh
        run: |
          $a = "aevalsrc='0.4*sin(2*PI*220*t)*gt(mod(t,7),1)':s=44100:d=720"
          .\ffmpeg.exe -v error -y -f lavfi -i $a -ac 2 -c:a aac -b:a 192k "테스트 녹음.m4a"
          .\ffmpeg.exe -v error -y -i "테스트 녹음.m4a" -c:a libmp3lame -b:a 128k test.mp3
          .\ffmpeg.exe -v error -y -f lavfi -i testsrc=s=320x240:r=30:d=720 -f lavfi -i $a -c:v libx264 -preset ultrafast -g 60 -c:a aac -shortest "테스트 영상.mp4"

      - name: Test splitting logic
        shell: pwsh
        run: |
          python app.py --cli "테스트 녹음.m4a" test.mp3 "테스트 영상.mp4"
          python app.py --cli --audio-only "테스트 영상.mp4"
          $checks = @{
            "테스트 녹음_분할\*.m4a" = 3; "test_분할\*.mp3" = 3;
            "테스트 영상_분할\*.mp4" = 3; "테스트 영상_분할\*.m4a" = 3
          }
          foreach ($k in $checks.Keys) {
            $n = (Get-ChildItem $k).Count
            Write-Host "$k : $n"
            if ($n -ne $checks[$k]) { throw "unexpected piece count for $k" }
          }
          Remove-Item -Recurse "테스트 녹음_분할", "test_분할", "테스트 영상_분할"

      - name: Test command-line version (pip install)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8   # 한글 경로를 그대로 받기
          $env:Path = "$PWD;$env:Path"   # 테스트용으로 받은 ffmpeg.exe를 쓰게
          pip install .
          ssakduk --version
          ssakduk "테스트 녹음.m4a" --out cli_out --json -q | Out-File -Encoding utf8 cli.json
          $r = Get-Content cli.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $r.ok -or $r.results[0].count -ne 3) { Get-Content cli.json; throw "cli test failed" }
          foreach ($p in $r.results[0].pieces) { if (-not (Test-Path -LiteralPath $p.path)) { throw "missing $($p.path)" } }
          ssakduk nope.m4a -q; if ($LASTEXITCODE -ne 1) { throw "expected exit 1" }
          $global:LASTEXITCODE = 0
          Remove-Item -Recurse cli_out, cli.json

      - name: Build exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Ssakduk --icon icon.ico --add-data "icon.ico;." --collect-all tkinterdnd2 --add-binary "ffmpeg.exe;." app.py
          pyinstaller --noconfirm --onefile --console --name ssakduk-cli --icon icon.ico --add-binary "ffmpeg.exe;." ssakduk_cli.py

      - name: Test built exe
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          Remove-Item ffmpeg.exe   # exe 안에 묶인 ffmpeg를 쓰는지 확인
          $p = Start-Process -FilePath dist\Ssakduk.exe -ArgumentList '--cli','--log','exe_log.txt','test.mp3' -Wait -PassThru
          Get-Content exe_log.txt
          if ($p.ExitCode -ne 0) { throw "exe test failed" }
          if (-not (Select-String -Path exe_log.txt -Pattern '^OK ')) { throw "exe did not split" }
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'ffmpeg|hostedtoolcache\\Python' }) -join ';'
          .\dist\ssakduk-cli.exe test.mp3 --out exe_cli_out --json -q | Out-File -Encoding utf8 exe_cli.json
          $r = Get-Content exe_cli.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $r.ok -or $r.results[0].count -ne 3) { Get-Content exe_cli.json; throw "cli exe test failed" }
          "ffmpeg used by cli exe is bundled: OK"

      - name: Make zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist\Ssakduk.exe pkg\
          Copy-Item OFFLINE_README.txt "pkg\사용법.txt"
          Copy-Item LICENSE pkg\LICENSE.txt
          Compress-Archive -Path pkg\* -DestinationPath Ssakduk-Windows.zip -CompressionLevel Optimal
          "{0:N1} MB" -f ((Get-Item Ssakduk-Windows.zip).Length / 1MB)

      - name: Checksums
        shell: pwsh
        run: |
          Copy-Item dist\ssakduk-cli.exe ssakduk-cli.exe
          $lines = foreach ($f in 'Ssakduk-Windows.zip', 'ssakduk-cli.exe') {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
          }
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sums = (Get-Content SHA256SUMS.txt) -join "`n"
          gh release delete latest --yes --cleanup-tag 2>$null
          $fence = '```'
          $notes = "싹둑 오프라인 버전 (Windows 10/11, 64비트)`n`nSsakduk-Windows.zip 을 받아 압축을 풀고 Ssakduk.exe 를 실행하세요. 설치·회원가입 필요 없음.`n`nssakduk-cli.exe: 명령어·AI 도구용 (사용법: https://github.com/iamandykim9/ssakduk/blob/main/skills/ssakduk/SKILL.md)`n`nSHA-256 (받은 파일이 진짜인지 확인용, SHA256SUMS.txt 와 같음):`n$fence`n$sums`n$fence`n`n빌드: ${{ github.sha }}"
          gh release create latest Ssakduk-Windows.zip ssakduk-cli.exe SHA256SUMS.txt --title "싹둑 오프라인 버전 (최신)" --notes $notes --latest
